---
flavor: wmo
owner: World Meteorological Organization
base-flavor: iho
base-override:
  # Word output is the uniword DOCX package (metanorma-iso#1728 ruling:
  # uniword is the only DOCX engine; the legacy isodoc HTML-as-.doc
  # fallback ships unreadable text files).
  doc-engine: uniword
  filename-attributes:
    # Flavor processor config: fonts, doctype registry, namespaces,
    # stages (the IALA taste's customize metanorma.yml pattern).
    customize: metanorma.yml
    htmlstylesheet: htmlstyle.css
    htmlcoverpage: htmlcoverpage.html
    copyright-notice: copyright.adoc
    i18n-dictionary: i18n.yaml
    publisher-logo: logo-wmo.svg
    # WMO-taste PDF cover: standalone stylesheet (fork of the IALA one)
    # applied over the base iho XSL via the xsl-file-override flag.
    # The IHO stylesheets are never modified.
    pdf-stylesheet-override: wmo.xsl
  value-attributes:
    publisher: World Meteorological Organization
    publisher_abbr: WMO
    # WMO Visual Identity June 2016, A5 "Fonts": governance and
    # technical publications set titles and body in the ITC Stone Sans
    # family — body text Stone Sans Medium 10 pt (the provisioned set's
    # lightest cut; FOP resolves normal weight to it). Verdana is the
    # guide's font for session documents only, and the faces the
    # brand names are provisioned through the private fontist formulas
    # (metanorma/fontist-formulas-private: stone_sans, pf_bague_sans_pro,
    # univers_lt_std — installed via `fontist repo setup metanorma`).
    body-font: Stone Sans ITC TT, Univers LT Std, Arial, sans-serif
    header-font: Stone Sans ITC TT, Arial, sans-serif
    monospace-font: '"Source Code Pro", monospace'
    # The WMO brand faces first (no monospace face exists in the WMO
    # publications measured — WMO-No. 574 embeds none); Source Code Pro
    # stays for Metanorma sourcecode, Source Han Sans for CJK, STIX Two
    # Math for formulas. Courier New is a system face. Univers LT Std is
    # provisioned in the formula but is not listed here: fontist
    # resolves faces by family name and the Univers faces carry
    # numbered sub-family names (Univers LT Std 55 and friends).
    fonts: Stone Sans ITC TT;PF Bague Sans Pro;Source Code Pro;Source Han Sans;STIX Two Math
    output-extensions: xml,html,pdf,doc
doctypes:
  # Governance publications (B5): plain Pantone covers
- taste: manual
  base: manual            # Pantone 187 red
  override-attributes:
  - presentation-metadata-wmo-cover-class: manual
- taste: guide
  base: guideline         # Pantone 341 green
  override-attributes:
  - presentation-metadata-wmo-cover-class: guide
- taste: guideline
  base: guideline         # abstract background in shades of green
  override-attributes:
  - presentation-metadata-wmo-cover-class: guideline
  # Constituent-body session reports (B5): plain Pantone covers
- taste: ec-report
  base: report            # Executive Council; Pantone 108 yellow
  override-attributes:
  - presentation-metadata-wmo-cover-class: ec-report
- taste: congress-report
  base: report            # Congress; Pantone 108 yellow
  override-attributes:
  - presentation-metadata-wmo-cover-class: congress-report
- taste: ra-report
  base: report            # Regional Association; Pantone 196 pink
  override-attributes:
  - presentation-metadata-wmo-cover-class: ra-report
- taste: tc-report
  base: report            # Technical Commission; Pantone 368 light green
  override-attributes:
  - presentation-metadata-wmo-cover-class: tc-report
  # Technical publications (B14): abstract background + cover image
- taste: standard
  base: standard
- taste: specification
  base: specification
- taste: resolution
  base: resolution
- taste: regulation
  base: regulation
